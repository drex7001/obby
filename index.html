<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏁</text></svg>" />
    <title>Gauntlet Run</title>
  </head>
  <body>
    <canvas id="stage" touch-action="none"></canvas>

    <!-- Nameplates are projected DOM, not in-scene sprites: crisper text, and
         no extra Babylon GUI dependency. -->
    <div id="nameplates" aria-hidden="true"></div>

    <div id="hud" hidden>
      <div class="hud-corner hud-tl">
        <div id="position" class="pos"><span id="pos-rank">--</span><span id="pos-of"></span></div>
        <div id="section" class="section">Starting line</div>
      </div>

      <div class="hud-corner hud-tr">
        <div id="clock" class="clock">00:00.00</div>
        <div id="round" class="round"></div>
      </div>

      <div class="hud-corner hud-bl">
        <ol id="board" class="board"></ol>
      </div>

      <div class="hud-corner hud-br">
        <div id="notes" class="notes"></div>
        <div class="keys">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
          <span><kbd>Space</kbd> jump</span>
          <span><kbd>R</kbd> respawn</span>
        </div>
      </div>

      <div id="centre" class="centre"></div>
    </div>

    <div id="overlay" class="overlay">
      <div class="panel">
        <h1 class="title">Gauntlet<span>Run</span></h1>
        <p class="tagline">Six runners. One course. It does not wait for you.</p>

        <div id="join-form">
          <label class="field">
            <span>Runner name</span>
            <input id="name-input" type="text" maxlength="14" placeholder="Runner" autocomplete="off" />
          </label>
          <button id="join-btn" class="primary">Enter the race</button>
          <p id="join-status" class="status">Connecting&hellip;</p>
        </div>
      </div>
    </div>

    <!-- Shown whenever the pointer lock is released (Esc, Alt+Tab, focus loss).
         The race carries on without you, so this is a prompt, not a pause. -->
    <div id="resume" class="overlay resume" hidden>
      <div class="panel">
        <h2 class="resume-title">Mouse released</h2>
        <p class="tagline">The race is still running without you.</p>
        <button id="resume-btn" class="primary">Click to resume</button>
        <p class="status">Press <kbd>Esc</kbd> any time to release it again.</p>
      </div>
    </div>

    <div id="results" class="overlay results" hidden>
      <div class="panel wide">
        <h2 id="results-title">Final standings</h2>
        <ol id="results-list" class="standings"></ol>
        <p id="results-next" class="status"></p>
      </div>
    </div>

    <script type="module" src="/src/client/index.ts"></script>
  </body>
</html>
